# ADR Configuration
# This file defines the domain numbering system and validation rules.
# Used by: docs/scripts/adr

project_name: Knowledge Graph System

# Domain Number Series
# Each domain reserves a range of 100 numbers for ADRs.
# New ADRs are assigned the next available number in their domain.
domains:
  infra:
    range: [100, 199]
    name: Infrastructure
    description: Containers, deployment, backup, storage, networking
    folder: infrastructure

  db:
    range: [200, 299]
    name: Database/Schema
    description: Apache AGE, migrations, schema design, PostgreSQL
    folder: database-schema

  ingest:
    range: [300, 399]
    name: Ingestion
    description: Content processing, jobs, extraction, deduplication
    folder: ingestion-content

  auth:
    range: [400, 499]
    name: Auth/Security
    description: RBAC, OAuth, API keys, endpoint security
    folder: authentication-security

  query:
    range: [500, 599]
    name: Query/Search
    description: Pathfinding, projections, diversity, search
    folder: query-search

  vocab:
    range: [600, 699]
    name: Vocabulary
    description: Relationships, grounding, categorization
    folder: vocabulary-relationships

  ui:
    range: [700, 799]
    name: Interfaces
    description: CLI, web, FUSE, MCP, visualization
    folder: [user-interfaces, visualization]

  ai:
    range: [800, 899]
    name: AI/Embeddings
    description: Providers, extraction, convergence, prompts
    folder: ai-embeddings

  meta:
    range: [900, 999]
    name: Meta/Process
    description: Documentation, workflow, access models, ADR system
    folder: access-workflow

# The record contract (ADR-304). With `contract: adr/v1`, records are typed:
# each declares a kind, and a decision names a verb, a capability and its
# basis. Records under archive/ stay on adr/v0.
contract: adr/v1

kinds:
  decision:
    verb: required
    requires: [capability, basis, agent]
    sections: [Summary]
    edges: { supersedes: decision, amends: decision, extends: decision, basis: [decision, spec, evidence] }
  spec:
    verb: forbidden
    requires: [capability]
    edges: { supersedes: spec, decided_by: decision }
  evidence:
    verb: forbidden
    requires: [capability]
    edges: { supersedes: evidence }

# What the platform does, one line each. A record's `capability` names one or
# more of these; a decision adds, cuts, changes, retires or constrains them.
capabilities:
  jobs: The job queue, dispatch, approval, scheduling and progress reporting
  deploy: Container images, install paths, the appliance, TLS and the operator lifecycle
  backup: Backup, restore and the portable graph archive
  storage: Garage object storage and artifact persistence
  graph: The Apache AGE schema, migrations, the epoch log and graph acceleration
  annealing: Ontology annealing and the graph's self-organizing structure
  ingest: Document intake, preprocessing, image ingestion and the source lifecycle
  extraction: LLM concept extraction, concept matching and deduplication
  auth: Users, roles, OAuth clients, API keys and endpoint security
  query: Search, pathfinding, graph programs and the catalog
  vocabulary: Relationship types, their categorization and consolidation
  grounding: Grounding, polarity axes, truth convergence and diversity signals
  providers: AI provider configuration, model catalogs, local inference and rate limits
  embeddings: Embedding models, profiles and modality spaces
  cli: The TypeScript CLI and MCP server
  web: The web workstation, explorers and visualization
  fuse: The FUSE filesystem
  process: Decision records, documentation and the development process

# The basis sources a decision may name (ADR-304 §11).
basis_sources: [operator, evidence, standard, upstream, precedent]

repository: github.com/aaronsb/knowledge-graph-system

# Valid ADR statuses (adr/v0 records)
statuses:
  - Draft       # Initial creation, not yet proposed
  - Proposed    # Under discussion/review
  - Accepted    # Approved and ready for implementation
  - Superseded  # Replaced by another ADR
  - Deprecated  # No longer relevant
  - Rejected    # Considered and declined, or proposed and never adopted

# Default values for new ADRs
defaults:
  deciders: []
  status: Draft

# Retired number range (pre-domain numbering).
# These ADRs were renumbered into their domain bands on 2026-06-15 (ADR-900
# amendment). The range is now vacated: no ADR uses 1–99, and doclint's
# retired-range guard fails the build on any reference into it.
legacy:
  range: [1, 99]
  label: "Retired (renumbered into domains 2026-06-15)"
  retired: true   # vacated range — doclint fails the build on any reference into 1–99
  defining_adr: ADR-900   # the ADR that vacated the range; exempt — it names retired numbers legitimately

# Viewer command for `adr view`
# Use {file} as placeholder for the file path
viewer: glow {file}

# adr cite skips these: frozen migrations and the checkpoint baseline carry
# pre-renumbering ADR numbers in their comments, the schema reference is
# generated from them, and doclint's fixtures carry example numbers.
cite:
  exclude:
    - schema/migrations/archived
    - schema/00_baseline.sql
    - docs/reference/schema.md
    - docs/scripts/doclint.py
